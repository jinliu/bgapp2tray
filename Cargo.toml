[package]
name = "bgapp2tray"
version = "0.1.0"
description = "Bridge between XDG Background Portal and system tray"
authors = ["Jin Liu <m.liu.jin@gmail.com>"]
repository = "https://github.com/jinliu/bgapp2tray"
license = "Apache-2.0"
keywords = ["xdg", "sni", "tray", "systray"]
categories = ["command-line-utilities"]
edition = "2024"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
codegen-units = 1

[[bin]]
name = "bgapp2tray"
path = "src/bgapp2tray/bgapp2tray.rs"

[[bin]]
name = "bgapp2tray-helper"
path = "src/bgapp2tray-helper/helper.rs"

[[bin]]
name = "xdg-desktop-portal-bgapp"
path = "src/portal/portal.rs"

[dependencies]
confique = { version = "0.4.0", features = ["toml"] }
env_logger = "0.11.11"
freedesktop-desktop-entry = "0.8.1"
futures-util = "0.3.34"
json-escape = "0.3.1"
libappindicator-zbus = "0.2.0"
log = "0.4.33"
tokio = {version = "1.53.0", features = ["full"]}
unicase = "2.9.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
xdg = "3.0.0"
zbus = { version = "5.19.0", features = ["tokio"] }

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = true
features = ["precommit-hook", "run-cargo-check", "run-cargo-clippy", "run-cargo-fmt"]
